<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  body{font-family:system-ui,sans-serif;background:#0f1220;color:#e8eaf2;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}
  .card{background:#171b2e;padding:28px;border-radius:14px;width:min(92vw,380px)}
  h1{font-size:20px;margin:0 0 16px}
  input{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #2a3050;background:#0f1220;color:#e8eaf2;font-size:16px}
  button{width:100%;padding:12px;margin-top:12px;border:0;border-radius:8px;background:#5b8cff;color:#fff;font-size:16px;font-weight:600}
  #msg{margin-top:14px;font-size:14px;line-height:1.4}
  .ok{color:#7ee2a0}.bad{color:#ff8a8a}
</style>
</head>
<body>
<div class="card">
  <h1>Set a new password</h1>
  <input id="p1" type="password" placeholder="New password" autocomplete="new-password">
  <input id="p2" type="password" placeholder="Repeat new password" autocomplete="new-password">
  <button id="go">Update password</button>
  <div id="msg"></div>
</div>
<script>
const sb = supabase.createClient(window.__SUPABASE_URL__, window.__SUPABASE_KEY__);
const msg = (t, ok) => { const m = document.getElementById('msg'); m.textContent = t; m.className = ok ? 'ok' : 'bad'; };
document.getElementById('go').onclick = async () => {
  const a = document.getElementById('p1').value, b = document.getElementById('p2').value;
  if (!a || a !== b) return msg('Passwords do not match.', false);
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return msg('Not signed in.', false);
  const { error } = await sb.auth.updateUser({ password: a });
  if (error) return msg('Error: ' + error.message, false);
  msg('PASSWORD UPDATED OK for ' + session.user.email, true);
};
</script>
</body>
</html>
